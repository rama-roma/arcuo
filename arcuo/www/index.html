/* Layout: a phone-sized app shell centered on desktop, full-bleed on phones. Dark graphite + teal accent, light theme as an alternate. */
:root{
  --bg:#0b0e13; --phone:#141922; --surface:#1b222c; --surface2:#232b37; --line:#2e3744;
  --fg:#eef2f4; --mute:#97a3b1; --accent:#2dd4bf; --accent-ink:#04231f;
  --warn:#f5b84a; --bad:#ff7b7b; --fig:#2b3544;
  --display:'Unbounded','Onest',system-ui,sans-serif; --body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e6ecef; --phone:#f6f9fa; --surface:#ffffff; --surface2:#edf2f4; --line:#d5dde3;
    --fg:#12202a; --mute:#566673; --accent:#0d9488; --accent-ink:#ffffff; --warn:#b7791f; --bad:#d64545; --fig:#cdd7de;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e6ecef; --phone:#f6f9fa; --surface:#ffffff; --surface2:#edf2f4; --line:#d5dde3;
  --fg:#12202a; --mute:#566673; --accent:#0d9488; --accent-ink:#ffffff; --warn:#b7791f; --bad:#d64545; --fig:#cdd7de;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b0e13; --phone:#141922; --surface:#1b222c; --surface2:#232b37; --line:#2e3744;
  --fg:#eef2f4; --mute:#97a3b1; --accent:#2dd4bf; --accent-ink:#04231f;
  --warn:#f5b84a; --bad:#ff7b7b; --fig:#2b3544; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{height:100%;display:flex;align-items:center;justify-content:center;padding:12px}
#phone{position:relative;width:100%;max-width:400px;height:100%;max-height:820px;background:var(--phone);border:1px solid var(--line);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
@media (max-width:520px){
  #stage{padding:0}
  #phone{max-width:none;max-height:none;border:0;border-radius:0}
}
#scr{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-bottom:20px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}
.ic{flex:none}
.display{font-family:var(--display);font-weight:600;letter-spacing:-.01em}
h1,h2,h3,p{margin:0}
h1{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.2;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:0}
.mute{color:var(--mute)}
.small{font-size:12px;line-height:1.35}
.cap{font-size:11.5px;color:var(--mute);line-height:1.25}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding-top:16px;padding-bottom:8px;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em}
.mark{width:28px;height:28px;border-radius:10px;border:2px solid var(--accent);display:grid;place-items:center}
.mark::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.streak{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--warn)}
.streak svg{color:var(--warn)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .v{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.15;overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 18px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{min-height:40px;font-size:14px;padding:8px 14px;border-radius:12px;width:auto}
.btn.big{min-height:60px;font-size:18px;border-radius:20px;font-family:var(--display);font-weight:600}
.link{color:var(--accent);font-weight:500;font-size:14px}

/* chips and segments */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;min-height:42px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--fg)}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;font-weight:500}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.opt .tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent}
.opt[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--surface2);gap:2px}
.seg button{flex:1;min-height:34px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 0 var(--line)}

/* fields */
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mute)}
.in,select.in{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:16px}
.in:disabled{opacity:.55}
.in::placeholder{color:var(--mute)}
.note{padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.4}
.note.err{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.note.info{background:var(--surface2);color:var(--mute)}
.note.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--fg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}

/* list rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;min-height:50px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .ico{width:32px;height:32px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--accent);flex:none}
.li .lv{margin-left:auto;color:var(--mute);font-size:14px;text-align:right;min-width:0}
.sw{width:46px;height:28px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none;margin-left:auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mute);transition:transform .18s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--accent-ink)}

/* rings */
.ringc{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 10px}
.rw{position:relative;width:96px;height:96px}
.rw svg{width:100%;height:100%;display:block}
.rc{position:absolute;inset:0;display:grid;place-items:center;color:var(--accent)}
.rv{font-family:var(--display);font-weight:600;font-size:15px}
.plus{display:inline-flex;align-items:center;gap:4px;margin-top:2px;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--accent);font-size:12px;font-weight:600}

/* figure */
.figwrap{display:flex;justify-content:center;padding:6px 0}
.figwrap svg{height:250px;width:auto;display:block}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}

/* nav */
#nav{display:flex;border-top:1px solid var(--line);background:var(--phone);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--mute);font-size:10.5px;font-weight:500;min-width:0}
#nav button[aria-current="page"]{color:var(--accent)}

/* avatar */
.ava{width:84px;height:84px;border-radius:50%;border:2px solid var(--accent);background:var(--surface2);display:grid;place-items:center;overflow:hidden;position:relative;cursor:pointer;font-family:var(--display);font-size:28px;color:var(--accent)}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava .cam{position:absolute;right:0;bottom:0;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}

/* splash / welcome */
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.splashmark{width:84px;height:84px;border-radius:28px;border:3px solid var(--accent);display:grid;place-items:center}
.splashmark::after{content:"";width:24px;height:24px;border-radius:50%;background:var(--accent)}
.load{width:96px;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.load i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;animation:ld 1.5s ease-out forwards}
@keyframes ld{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hello{font-family:var(--display);font-weight:600;font-size:54px;letter-spacing:-.03em;color:var(--accent)}
.slide{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dots{display:flex;gap:7px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:20px;border-radius:99px}

/* toast */
#toast{position:absolute;left:50%;bottom:84px;transform:translate(-50%,12px);max-width:86%;padding:11px 16px;border-radius:14px;background:var(--fg);color:var(--bg);font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center;z-index:5}
#toast.show{opacity:1;transform:translate(-50%,0)}
.svgtxt{font-family:var(--body)}
.exrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);min-height:60px}
.exrow .no{width:30px;height:30px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-family:var(--display);font-size:13px;flex:none}
.exrow[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.exrow[aria-pressed="true"] .no{background:var(--accent);color:var(--accent-ink)}
.exrow[aria-pressed="true"] .nm{text-decoration:line-through;opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.load i{transform:none}}
</style>

var ACT={sed:1.2,light:1.375,mod:1.55,high:1.725};
function ageFrom(b){if(!b)return null;var d=new Date(b+'T00:00:00'),n=new Date();if(isNaN(d.getTime()))return null;var a=n.getFullYear()-d.getFullYear();var m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return a}
function bmiOf(w,h){return w/Math.pow(h/100,2)}
function curW(){return S.weights.length?S.weights[S.weights.length-1].w:S.p.weight}
function startW(){return S.weights.length?S.weights[0].w:S.p.weight}
function kcalFor(p,w){
  var a=ageFrom(p.birth);if(a==null)a=25;
  var bmr=10*w+6.25*p.height-5*a+(p.gender==='m'?5:-161);
  var k=bmr*ACT[p.act];
  if(p.goal==='lose')k-=(a<18?200:500);
  else if(p.goal==='gain')k+=300;
  var floor=(p.gender==='m'?1500:1200)+(a<18?200:0);
  return Math.round(Math.max(k,floor)/10)*10;
}
function macros(){
  var k=kcalFor(S.p,curW());var P=Math.round(curW()*(S.p.goal==='gain'?1.8:1.6));
  var F=Math.round(k*0.27/9);var C=Math.max(0,Math.round((k-4*P-9*F)/4));
  return {k:k,p:P,f:F,c:C};
}
function validate(){
  var p=S.p,a=ageFrom(p.birth);
  if(!p.birth||a==null)return {k:'needBirth'};
  if(a<13)return {k:'ageMin'};
  if(a>100)return {k:'ageMax'};
  if(!(p.height>=120&&p.height<=220))return {k:'hRange'};
  if(!(p.weight>=30&&p.weight<=250)||!(p.target>=30&&p.target<=250))return {k:'wRange'};
  var h2=Math.pow(p.height/100,2),lo=(a<18?18:18.5)*h2,hi=(a<18?24.9:30)*h2;
  if(p.goal==='lose'){
    if(p.target>=p.weight)return {k:'goalLose'};
    if(p.target<lo)return {k:'bmiLow',a:{min:Math.ceil(lo)}};
    if((p.weight-p.target)/p.weight>0.25)return {k:'tooBig'};
  }else if(p.goal==='gain'){
    if(p.target<=p.weight)return {k:'goalGain'};
    if(p.target>hi)return {k:'bmiHigh',a:{max:Math.floor(hi)}};
    if((p.target-p.weight)/p.weight>0.25)return {k:'tooBig'};
  }
  return {k:null};
}

   +'C'+(cx+sw)+',132 '+(cx+ww+2)+',142 '+(cx+ww)+',166 C'+(cx+ww)+',186 '+(cx+hw)+',196 '+(cx+hw)+',214 '

  var lines=[
   [cx-sw+2,108,cx-sw-9-f*3,200,aw],[cx+sw-2,108,cx+sw+9+f*3,200,aw],
   [cx-hw*0.5,220,cx-hw*0.4,302,tw],[cx+hw*0.5,220,cx+hw*0.4,302,tw],

  function L(l,col,add,op){return '<line x1="'+l[0]+'" y1="'+l[1]+'" x2="'+l[2]+'" y2="'+l[3]+'" stroke="'+col+'" stroke-width="'+(l[4]+add)+'" stroke-linecap="round"'+(op?' stroke-opacity="'+op+'"':'')+'/>'}
  var hr=m?17:16;

  out+='<circle cx="100" cy="62" r="'+(hr+1.3)+'" fill="none" stroke="var(--accent)" stroke-opacity="0.55" stroke-width="1"/>';

  out+='<circle cx="100" cy="62" r="'+hr+'" fill="var(--fig)"/>';

function wChart(){
  var pts=S.weights.slice(-8),W=320,H=180,l=34,r=12,tp=12,b=26;
  var ws=pts.map(function(p){return p.w}).concat([S.p.target]);
  var mn=Math.floor(Math.min.apply(null,ws)-1),mx=Math.ceil(Math.max.apply(null,ws)+1);
  var step=Math.max(1,Math.ceil((mx-mn)/4));mx=mn+step*4;
  function X(i){return pts.length===1?l+(W-l-r)/2:l+i*(W-l-r)/(pts.length-1)}
  function Y(v){return tp+(mx-v)*(H-tp-b)/(mx-mn)}
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="'+esc(t('wByWeek'))+'">';
  for(var k=0;k<=4;k++){var v=mn+k*step;s+='<line x1="'+l+'" y1="'+Y(v)+'" x2="'+(W-r)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(l-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--mute)" class="svgtxt">'+v+'</text>'}
  s+='<line x1="'+l+'" y1="'+Y(S.p.target)+'" x2="'+(W-r)+'" y2="'+Y(S.p.target)+'" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="'+(W-r)+'" y="'+(Y(S.p.target)-5)+'" text-anchor="end" font-size="10" fill="var(--warn)" class="svgtxt">'+t('tgt')+' '+S.p.target+'</text>';
  if(pts.length>1)s+='<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p,i){return X(i)+','+Y(p.w)}).join(' ')+'"/>';
  pts.forEach(function(p,i){s+='<circle cx="'+X(i)+'" cy="'+Y(p.w)+'" r="'+(i===pts.length-1?5:3.5)+'" fill="var(--accent)"/>'});
  var last=pts.length-1;s+='<text x="'+X(last)+'" y="'+(Y(pts[last].w)-10)+'" text-anchor="'+(last===0?'middle':'end')+'" font-size="11" font-weight="600" fill="var(--fg)" class="svgtxt">'+pts[last].w+'</text>';
  pts.forEach(function(p,i){if(i===0||i===last||pts.length<=4)s+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--mute)" class="svgtxt">'+dm(p.d)+'</text>'});
  return s+'</svg>';
}

function vSettings(){
  var langSeg='<div class="seg" style="margin-left:auto"><button data-act="lang" data-arg="ru" aria-pressed="'+(S.lang==='ru')+'">RU</button><button data-act="lang" data-arg="en" aria-pressed="'+(S.lang==='en')+'">EN</button></div>';
  var themeSeg='<div class="seg" style="margin-left:auto"><button data-act="theme" data-arg="dark" aria-pressed="'+(S.theme==='dark')+'">'+t('dark')+'</button><button data-act="theme" data-arg="light" aria-pressed="'+(S.theme==='light')+'">'+t('light')+'</button></div>';
  var durSeg='<div class="seg" style="margin-left:auto">'+[15,30,45].map(function(m){return '<button data-act="dur" data-arg="'+m+'" aria-pressed="'+(S.dur===m)+'">'+m+'</button>'}).join('')+'</div>';
  return backTop(t('setTitle'))
   +'<div class="stack pad"><div class="stack" style="align-items:center;gap:12px">'+avatarHtml()+'<label class="f" style="width:100%">'+t('nameS')+'<input class="in" id="f-name2" data-bind="p.name" value="'+esc(S.p.name)+'" maxlength="32" autocomplete="off"></label></div>'
   +'<div class="list">'
   +'<div class="li"><span class="ico">'+ic('moon',18)+'</span><span>'+t('theme')+'</span>'+themeSeg+'</div>'
   +'<div class="li"><span class="ico">'+ic('globe',18)+'</span><span>'+t('lang')+'</span>'+langSeg+'</div>'
   +'<div class="li"><span class="ico">'+ic('bell',18)+'</span><span>'+t('notif')+'</span><button class="sw" role="switch" aria-checked="'+S.notif+'" aria-label="'+esc(t('notif'))+'" data-act="notif"></button></div>'
   +liBtn('go','plans','card',t('sub'),S.pro?'Pro':t('free'),ic('chev',16))
   +'<div class="li"><span class="ico">'+ic('clock',18)+'</span><span>'+t('durDef')+'</span>'+durSeg+'</div>'
   +'</div><div class="list">'
   +liBtn('rate','','star',t('rate'))+liBtn('fb','','chat',t('feedback'))+liBtn('cache','','broom',t('clearCache'))
   +(R.delAsk?'<div class="li" style="flex-direction:column;align-items:stretch;gap:10px"><span>'+t('delConfirm')+'</span><div class="row"><button class="btn sm" style="background:var(--bad);color:#fff" data-act="delYes">'+t('delYes')+'</button><button class="btn sm ghost" data-act="delNo">'+t('cancel')+'</button></div></div>':liBtn('delAsk','','trash',t('delData')))
   +'</div><button class="btn ghost" data-act="logout">'+ic('out',18)+t('logout')+'</button></div>';
}

function vPlans(){
  function feat(x){return '<li class="row" style="align-items:flex-start;gap:8px"><span style="color:var(--accent);margin-top:2px">'+ic('check',16)+'</span><span>'+x+'</span></li>'}
  return backTop(t('plansTitle'))
   +'<div class="stack pad"><div class="card stack"><div class="row spread"><h2>'+t('free')+'</h2>'+(S.pro?'':'<span class="cap" style="color:var(--accent)">'+t('cur')+'</span>')+'</div><ul class="stack" style="list-style:none;margin:0;padding:0;gap:8px">'+feat(t('f1'))+feat(t('f2'))+feat(t('f3'))+'</ul></div>'
   +'<div class="card stack" style="border-color:var(--accent)"><div class="row spread"><h2>Pro</h2><span class="display" style="font-size:14px">'+t('proPrice')+'</span></div><ul class="stack" style="list-style:none;margin:0;padding:0;gap:8px">'+feat(t('f4'))+feat(t('f5'))+feat(t('f6'))+feat(t('f7'))+'</ul></div>'
   +'<button class="btn" data-act="subscribe">'+t('subscribe')+'</button></div>';
}

var NAV=[['home','home','nav_home'],['progress','chart','nav_progress'],['workout','dumb','nav_workout'],['food','food','nav_food'],['profile','user','nav_profile']];
function navHtml(){return NAV.map(function(n){return '<button data-act="go" data-arg="'+n[0]+'"'+(R.route===n[0]?' aria-current="page"':'')+'>'+ic(n[1],22)+'<span>'+t(n[2])+'</span></button>'}).join('')}

/* ---------- render ---------- */
function render(){
  var root=document.documentElement;root.setAttribute('data-theme',S.theme);root.lang=S.lang;
  var r=R.route,h='',nav=false;
  if(r==='splash')h=vSplash();
  else if(r==='welcome')h=vWelcome();
  else if(r==='onboard')h=vOnboard();
  else if(r==='home'){h=vHome();nav=true}
  else if(r==='progress'){h=vProgress();nav=true}
  else if(r==='workout'){h=vWorkout();nav=(R.wstep!=='run'&&R.wstep!=='done'&&R.wstep!=='test')}
  else if(r==='food'){h=vFood();nav=true}
  else if(r==='profile'){h=vProfile();nav=true}
  else if(r==='settings')h=vSettings();
  else if(r==='plans')h=vPlans();
  var scr=$('#scr'),key=r+':'+R.wstep+':'+R.slide+':'+R.obStep+':'+R.test.q;
  var keep=scr.scrollTop,same=(key===R.lastRoute);
  scr.innerHTML=h;
  scr.scrollTop=same?keep:0;
  R.lastRoute=key;
  var n=$('#nav');n.hidden=!nav;n.innerHTML=nav?navHtml():'';
  if(r==='onboard')refreshOb();
}
function go(r){R.prev=R.route;R.route=r;if(r==='workout'){R.wstep=S.plan?'plan':'test';resetTest()}R.delAsk=false;render()}
function resetTest(){R.test={q:0,zones:[],level:'',dur:S.dur};R.done={}}
var toastTimer=null;
function toast(m){var e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){e.classList.remove('show')},2400)}

/* ---------- actions ---------- */
function act(a,arg,el){
  switch(a){
  case 'go':go(arg);break;
  case 'back':R.route=(R.route==='plans'?'settings':(R.editing?'profile':(R.prev&&R.prev!=='plans'&&R.prev!=='settings'?R.prev:'home')));R.editing=false;R.delAsk=false;render();break;
  case 'wnext':if(R.slide<2){R.slide++;render()}else{R.route='onboard';R.obStep=S.signedIn?2:1;render()}break;
  case 'wskip':R.route='onboard';R.obStep=S.signedIn?2:1;render();break;
  case 'google':S.signedIn=true;save();render();break;
  case 'obNext':R.obStep=2;render();break;
  case 'setp':var kv=arg.split(':');S.p[kv[0]]=kv[1];if(kv[0]==='goal'&&kv[1]==='tone')S.p.target=S.p.weight;save();render();break;
  case 'obDone':
    if(validate().k)return;
    var cw=S.p.weight,t0=todayStr();
    if(!S.weights.length||R.editing){if(S.weights.length&&S.weights[S.weights.length-1].d===t0)S.weights[S.weights.length-1].w=cw;else if(!S.weights.length||S.weights[S.weights.length-1].w!==cw)S.weights.push({d:t0,w:cw})}
    S.onboarded=true;touchStreak();save();R.editing=false;R.route='home';render();break;
  case 'editp':R.editing=true;R.prev='profile';R.route='onboard';S.p.weight=curW();render();break;
  case 'trainNow':R.fromPlan=false;R.route='workout';R.wstep='test';resetTest();render();break;
  case 'zone':var zi=R.test.zones.indexOf(arg);if(zi>-1)R.test.zones.splice(zi,1);else R.test.zones.push(arg);render();break;
  case 'lvl':R.test.level=arg;render();break;
  case 'durq':R.test.dur=parseInt(arg,10);render();break;
  case 'tnext':R.test.q++;render();break;
  case 'tback':if(R.test.q>0){R.test.q--;render()}else if(R.fromPlan&&S.plan){R.wstep='plan';render()}else{R.route='home';render()}break;
  case 'tbuild':S.plan=buildPlan(R.test);save();R.wstep='plan';R.done={};render();break;
  case 'retest':R.fromPlan=true;R.wstep='test';resetTest();render();break;
  case 'wstart':R.wstep='run';R.done={};render();break;
  case 'wback':R.wstep='plan';render();break;
  case 'tick':R.done[arg]=!R.done[arg];render();break;
  case 'wfinish':var d=day();d.workouts+=1;d.burn=(d.burn||0)+Math.round(S.plan.dur*6);save();R.wstep='done';render();break;
  case 'add':var dd=day();if(arg==='steps')dd.steps+=1000;else dd.water+=250;save();render();break;
  case 'mtype':R.mtype=arg;render();break;
  case 'quick':var f=FOODS[parseInt(arg,10)];day().meals.push({id:Date.now(),type:R.mtype,name:L2(f.n),kcal:f.k,p:f.p,f:f.f,c:f.c});save();render();break;
  case 'addmeal':var nm=($('#mn').value||'').trim(),kk=parseInt($('#mk').value,10);if(!nm||!(kk>0)){($('#mn').value?$('#mk'):$('#mn')).focus();return}day().meals.push({id:Date.now(),type:R.mtype,name:nm,kcal:kk,p:0,f:0,c:0});save();render();break;
  case 'delmeal':var dm2=day();dm2.meals=dm2.meals.filter(function(x){return String(x.id)!==String(arg)});save();render();break;
  case 'logw':var wv=parseFloat($('#wi').value);if(!(wv>=30&&wv<=250)){toast(t('wRange'));return}
    var t1=todayStr(),lw=S.weights[S.weights.length-1];if(lw&&lw.d===t1)lw.w=wv;else S.weights.push({d:t1,w:wv});S.demo=false;S.backup=null;save();render();break;
  case 'demo':S.backup=S.weights.slice();var base=curW(),dirn=S.p.goal==='gain'?-1:1,pts=[];for(var i=5;i>=0;i--){var dt=new Date();dt.setDate(dt.getDate()-i*7);pts.push({d:fmt(dt),w:r1(base+dirn*i*0.7)})}S.weights=pts;S.demo=true;save();render();break;
  case 'demoOff':S.weights=S.backup||[{d:todayStr(),w:curW()}];S.demo=false;S.backup=null;save();render();break;
  case 'lang':S.lang=arg;save();render();break;
  case 'theme':S.theme=arg;save();render();break;
  case 'notif':S.notif=!S.notif;save();render();break;
  case 'dur':S.dur=parseInt(arg,10);save();render();break;
  case 'rate':toast(t('tRate'));break;
  case 'fb':toast(t('tFb'));break;
  case 'cache':toast(t('tCache'));break;
  case 'delAsk':R.delAsk=true;render();break;
  case 'delNo':R.delAsk=false;render();break;
  case 'delYes':var lang=S.lang,th=S.theme;S=defaults();S.lang=lang;S.theme=th;save();R.delAsk=false;R.slide=0;R.obStep=1;R.route='welcome';render();break;
  case 'logout':S.onboarded=false;S.signedIn=false;save();R.slide=0;R.obStep=1;R.route='welcome';render();break;
  case 'subscribe':toast(t('tPay'));break;
  }
}
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;act(el.getAttribute('data-act'),el.getAttribute('data-arg'),el)});
function onBind(e){var el=e.target;var k=el&&el.getAttribute&&el.getAttribute('data-bind');if(!k)return;var v=el.value;if(el.type==='number')v=v===''?NaN:parseFloat(v);if(k.indexOf('p.')===0)S.p[k.slice(2)]=v;else S[k]=v;save();if(R.route==='onboard')refreshOb()}
document.addEventListener('input',onBind);
document.addEventListener('change',onBind);

/* avatar photo, resized so it fits in storage */
$('#avf').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();im.onload=function(){
    var s=160,c=document.createElement('canvas');c.width=s;c.height=s;var x=c.getContext('2d');
    var m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;
    x.drawImage(im,sx,sy,m,m,0,0,s,s);
    try{S.avatar=c.toDataURL('image/jpeg',0.82)}catch(err){return}
    save();toast(t('tPhoto'));render();e.target.value='';
  };im.src=fr.result};
  fr.readAsDataURL(f);
});

/* ---------- boot ---------- */
document.documentElement.setAttribute('data-theme',S.theme);
try{var SB=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.StatusBar;if(SB){SB.setBackgroundColor({color:S.theme==='light'?'#f6f9fa':'#141922'});SB.setStyle({style:S.theme==='light'?'LIGHT':'DARK'})}}catch(e){}
render();
setTimeout(function(){
  if(R.route!=='splash')return;
  if(S.onboarded){touchStreak();R.route='home'}else{R.route='welcome'}
  render();
},1700);
})();
</script>

</body>
</html>
