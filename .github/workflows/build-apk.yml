name: Build Arcuo APK

on:
  workflow_dispatch:
  push:
    branches: [main]

defaults:
  run:
    working-directory: arcuo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arcuo/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: arcuo/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arcuo-apk
          path: arcuo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
